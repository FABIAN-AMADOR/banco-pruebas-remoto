<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Pruebas IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MITAD IZQUIERDA: EL AGENTE IA Y HARDWARE -->
    <div class="agent-panel">
        <!-- Espacio para Logos -->
        <div class="logos-container">
            <div class="logo-placeholder">Logo 1</div>
            <img src="tu-logo-2.png" alt="Logo Derecho" class="logo-img">
        </div>

        <!-- Avatar IA (Movido hacia arriba por CSS) -->
        <div class="avatar-container">
            <svg id="agent-eyes" viewBox="0 0 100 50" width="120" height="60">
                <rect class="eye" x="20" y="10" width="20" height="30" rx="10" fill="#22D3EE" />
                <rect class="eye" x="60" y="10" width="20" height="30" rx="10" fill="#22D3EE" />
            </svg>
        </div>
        <div class="agent-status" id="agent-status-text">Agente en reposo...</div>

        <!-- CONSOLA DE HARDWARE FÍSICO (TIPO YOKOGAWA) -->
        <div class="hardware-console">
            
            <!-- Grupo 1: Formas de Onda -->
            <div class="hard-section">
                <span class="hard-label">WAVEFORM</span>
                <div class="hard-btn signal-btn" id="btn-seno" onclick="setFisicoSignal('senoidal', this)">SINE</div>
                <div class="hard-btn signal-btn" id="btn-cuadrada" onclick="setFisicoSignal('cuadrada', this)">SQR</div>
                <div class="hard-btn signal-btn" id="btn-triangular" onclick="setFisicoSignal('triangular', this)">TRI</div>
            </div>

            <!-- Grupo 2: Selección de Parámetros -->
            <div class="hard-section">
                <span class="hard-label">CONTROL</span>
                <div class="hard-btn param-btn pressed" id="btn-freq" onclick="setFisicoParam('freq', this)">FREQ</div>
                <div class="hard-btn param-btn" id="btn-amp" onclick="setFisicoParam('amp', this)">AMPL</div>
                <div class="hard-btn param-btn" id="btn-span" onclick="setFisicoParam('bw', this)">SPAN</div>
                <div class="hard-btn param-btn" id="btn-rbw" onclick="setFisicoParam('bw', this)">RBW</div>
            </div>

            <!-- Grupo 3: Perilla de Ajuste Maestro -->
            <div class="hard-section">
                <span class="hard-label">ADJUST / VALUE</span>
                <div class="hard-knob" id="knob-main" title="Gira la rueda del ratón para ajustar"></div>
            </div>

        </div>
        <!-- Controles Manuales Neón (Conservados abajo) -->
        <div class="agent-controls">
            <button id="btn-mic" class="neon-btn cyan-glow">🎤 Hablar</button>
            <button id="btn-power-manual" class="neon-btn green-glow">⚡ Encender</button>
        </div>
    </div>
    <!-- MITAD DERECHA: LABORATORIO VIRTUAL INCRUSTADO -->
    <div class="lab-panel" style="padding: 0; overflow: hidden; background-color: #000;">
        <iframe 
            src="https://lab-com-virtual.vercel.app/" 
            width="100%" 
            height="100%" 
            style="border: none;" 
            title="Laboratorio Virtual Externo"
            allow="microphone; camera"
        ></iframe>
    </div>

    <script src="app.js"></script>
</body>
</html>
