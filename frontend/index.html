<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Pruebas IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- MITAD IZQUIERDA: EL AGENTE IA -->
    <div class="agent-panel">
        <!-- Espacio para Logos -->
        <div class="logos-container">
            <div class="logo-placeholder">Logo 1</div>
            <!-- Reemplaza 'nombre-de-tu-imagen.png' por el archivo que tienes en tu carpeta -->
            <img src="nombre-de-tu-imagen.png" alt="Logo Derecho" class="logo-img">
        </div>

        <!-- Avatar IA -->
        <div class="avatar-container">
            <svg id="agent-eyes" viewBox="0 0 100 50" width="150" height="75">
                <rect class="eye" x="20" y="10" width="20" height="30" rx="10" fill="#22D3EE" />
                <rect class="eye" x="60" y="10" width="20" height="30" rx="10" fill="#22D3EE" />
            </svg>
        </div>
        <div class="agent-status" id="agent-status-text">Agente en reposo...</div>

        <!-- Controles Manuales Neón -->
        <div class="agent-controls">
            <button id="btn-mic" class="neon-btn cyan-glow">🎤 Hablar con IA</button>
            <button id="btn-power-manual" class="neon-btn green-glow">⚡ Encender Lab</button>
        </div>
    </div>

    <!-- MITAD DERECHA: LABORATORIO VIRTUAL INCRUSTADO -->
    <div class="lab-panel" style="padding: 0; overflow: hidden; background-color: #000;">
        <iframe 
            src="https://lab-com-virtual.vercel.app/" 
            width="100%" 
            height="100%" 
            style="border: none;" 
            title="Laboratorio Virtual Externo"
            allow="microphone; camera"
        ></iframe>
    </div>

    <script src="app.js"></script>
</body>
</html>
