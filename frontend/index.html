<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de Pruebas Remoto</title>
    <!-- Esta línea es la que evita que se vea blanco -->
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <!-- NUEVA MITAD IZQUIERDA: EL AGENTE IA -->
    <div class="agent-panel">
        <div class="avatar-container">
            <svg id="agent-eyes" viewBox="0 0 100 50" width="150" height="75">
                <!-- Ojo Izquierdo -->
                <rect class="eye" x="20" y="10" width="20" height="30" rx="10" fill="#22D3EE" />
                <!-- Ojo Derecho -->
                <rect class="eye" x="60" y="10" width="20" height="30" rx="10" fill="#22D3EE" />
            </svg>
        </div>
        <div class="agent-status" id="agent-status-text">Agente en reposo...</div>
    </div>

    <!-- MITAD DERECHA: LABORATORIO VIRTUAL INCRUSTADO -->
    <div class="lab-panel" style="padding: 0; overflow: hidden; background-color: #000;">
        <iframe 
            src="https://lab-com-virtual.vercel.app/" 
            width="100%" 
            height="100%" 
            style="border: none;" 
            title="Laboratorio Virtual Externo"
            allow="microphone; camera"
        ></iframe>
    </div>
        
        <footer class="generator-panel">
            <h2>GENERADOR DE SEÑALES - CONTROLES</h2>
            <div class="controls-container">
                <button id="btn-power" class="ctrl-btn off">APAGADO</button>
                <div class="control-group">
                    <label for="select-type">Tipo de Señal:</label>
                    <select id="select-type">
                        <option value="senoidal">Senoidal</option>
                        <option value="cuadrada">Cuadrada</option>
                        <option value="triangular">Triangular</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="input-freq">Frecuencia (Hz):</label>
                    <input type="number" id="input-freq" value="1000000" step="50000" min="100" max="10000">
                </div>
                <div class="control-group">
                    <label for="input-amp">Amplitud (dBm):</label>
                    <input type="number" id="input-amp" value="-10" step="1" min="-30" max="10">
                </div>
                <div class="control-group">
                    <label for="input-bw">Ancho de Banda (Hz):</label>
                    <input type="number" id="input-bw" value="100" step="10" min="50" max="1000">
                </div>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
